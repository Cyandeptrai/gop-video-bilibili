name: Build EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller comtypes edge-tts pydub pillow pywebview vieneu==3.8.5
      - name: Install ONNX Runtime DirectML (must be after vieneu so DirectML wins)
        run: pip install onnxruntime-directml==1.24.4
      - name: Smoke test ONNX Runtime (DirectML)
        run: |
          python -c "import onnxruntime as ort; print('ORT', ort.__version__); print(ort.get_available_providers())"
          python -c "import vieneu; print('vieneu OK', vieneu.__version__)"
          python -c "import onnxruntime as ort; assert 'DmlExecutionProvider' in ort.get_available_providers(), 'DmlExecutionProvider missing - DirectML did not win'; print('DmlExecutionProvider OK')"
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "Chipchipdownload" --icon chipchipdownload.ico --hidden-import=edge_tts --hidden-import=comtypes --hidden-import=comtypes.stream --hidden-import=comtypes.client --hidden-import=comtypes.gen --hidden-import=pydub --hidden-import=PIL --hidden-import=postman2d --collect-all onnxruntime --collect-all vieneu --collect-all webview Gop-Video-Bilibili-GUI.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Chipchipdownload-exe
          path: dist/Chipchipdownload.exe
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: Chipchipdownload-exe
          path: dist
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { & $iscc installer.iss } else { ISCC.exe installer.iss }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Chipchipdownload-Setup
          path: installer-out/Chipchipdownload-Setup-*.exe
  release:
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: Chipchipdownload-exe
          path: dist
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Chipchipdownload-Setup
          path: installer-out
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dist/Chipchipdownload.exe installer-out/Chipchipdownload-Setup-*.exe --title "Chipchipdownload ${{ github.ref_name }}" --notes "Chipchipdownload ${{ github.ref_name }} - Tool gop video Bilibili (hinh + tieng) thanh 1 video."
